<script>
/* ===== JARVIS Multiplayer (PeerJS, Stern-Topologie: Host leitet weiter) ===== */
const Store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const MP=(()=>{
  let peer=null,conns=[],host=false,myId=null,handlers=[],roster={};
  const listeners={status:[],roster:[]};
  const myName=()=>Store.get('jv_player_name','')||'Spieler';
  function fire(t,a){(listeners[t]||[]).forEach(f=>f(a))}
  function status(s){fire('status',s);const el=document.getElementById('mp-status');if(el)el.textContent=s}
  function emit(m,from){handlers.forEach(h=>{try{h(m,from)}catch(e){console.error(e)}})}
  function pushRoster(){if(!host)return;const r=Object.assign({},roster);r[myId]=myName();conns.forEach(c=>{try{c.send({type:'_roster',players:r})}catch(e){}});setRoster(r)}
  function setRoster(r){roster=r;fire('roster',roster);const el=document.getElementById('mp-players');if(el)el.innerHTML=Object.entries(roster).map(([id,n])=>'<span>'+(id===myId?'⭐ ':'👤 ')+esc(n)+'</span>').join('')}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function attach(c){
    c.on('open',()=>{conns.push(c);c.send({type:'_hello',name:myName()});status(host?'🟢 '+conns.length+' Mitspieler verbunden':'🟢 Verbunden mit Raum '+c.peer);emit({type:'_join',id:c.peer},c.peer)});
    c.on('data',d=>{
      if(!d||typeof d!=='object')return;
      if(d.type==='_hello'){roster[c.peer]=String(d.name||'Spieler').slice(0,16);pushRoster();return}
      if(d.type==='_roster'){setRoster(d.players);return}
      const from=d._from||c.peer;
      if(host&&!d._from){d._from=c.peer;conns.forEach(o=>{if(o!==c&&o.open)try{o.send(d)}catch(e){}})}
      emit(d,from)});
    c.on('close',()=>{conns=conns.filter(x=>x!==c);delete roster[c.peer];if(host)pushRoster();else setRoster({});emit({type:'_leave',id:c.peer},c.peer);status(host?'🔵 Raum offen · '+conns.length+' Mitspieler':'🔴 Verbindung beendet')});
    c.on('error',e=>status('Verbindungsfehler: '+(e&&e.message||e)));
  }
  function newPeer(id){
    if(typeof Peer==='undefined'){status('PeerJS konnte nicht geladen werden. Internet prüfen.');return null}
    leave(true);peer=id?new Peer(id,{debug:0}):new Peer({debug:0});
    peer.on('error',e=>status('Fehler: '+(e&&e.type==='peer-unavailable'?'Raum nicht gefunden':(e&&e.message||e))));
    peer.on('connection',c=>{if(host)attach(c);else c.close()});
    return peer}
  function hostRoom(prefix){const code=(prefix||'JV')+'-'+Math.random().toString(36).slice(2,7).toUpperCase();const p=newPeer(code);if(!p)return;host=true;status('⏳ Raum wird erstellt…');p.on('open',id=>{myId=id;const r=document.getElementById('mp-code');if(r)r.value=id;setRoster({[id]:myName()});status('🔵 Raum '+id+' bereit – Code teilen!');emit({type:'_hosted',id},id)})}
  function join(code){code=(code||'').trim().toUpperCase();if(!code){status('Bitte Raumcode eingeben.');return}const p=newPeer();if(!p)return;host=false;status('⏳ Verbinde…');p.on('open',id=>{myId=id;attach(p.connect(code,{reliable:true}))})}
  function leave(silent){conns.forEach(c=>{try{c.close()}catch(e){}});conns=[];if(peer){try{peer.destroy()}catch(e){}}peer=null;host=false;roster={};setRoster({});if(!silent){status('Offline – Einzelspieler');emit({type:'_left'},null)}}
  function send(m){if(!conns.length)return;m._from=myId;conns.forEach(c=>{if(c.open)try{c.send(m)}catch(e){}})}
  function mountPanel(opts){
    opts=opts||{};
    const css=document.createElement('style');css.textContent=`
#mp-btn{position:fixed;right:10px;bottom:10px;z-index:9000;background:#0d1b2a;color:#0ff;border:1px solid #0ff8;border-radius:22px;padding:9px 14px;font:bold 14px Arial,sans-serif;box-shadow:0 0 12px #0ff4;cursor:pointer}
#mp-panel{position:fixed;right:10px;bottom:56px;z-index:9001;width:min(310px,calc(100vw - 20px));background:#0a0f1fef;border:1px solid #0ff6;border-radius:14px;padding:12px;color:#cfe;font:14px Arial,sans-serif;display:none;box-shadow:0 8px 30px #000a}
#mp-panel.open{display:block}#mp-panel h3{margin:0 0 8px;color:#0ff;font-size:15px}
#mp-panel input{width:100%;padding:8px;border-radius:8px;border:1px solid #0ff5;background:#06101c;color:#fff;font-size:14px;margin:3px 0 7px;box-sizing:border-box}
#mp-panel .row{display:flex;gap:6px}#mp-panel button{flex:1;padding:8px 6px;border-radius:8px;border:0;background:#0aa;color:#001;font-weight:bold;cursor:pointer;font-size:13px}
#mp-panel button.sec{background:#223a4a;color:#cff}#mp-status{font-size:12px;color:#8cd;margin-top:8px;min-height:16px}
#mp-players{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:12px}#mp-players span{background:#123;padding:3px 7px;border-radius:10px}
#mp-extra{margin-top:8px}#mp-panel small{color:#7aa;display:block;margin-top:6px;line-height:1.35}`;
    document.head.appendChild(css);
    const b=document.createElement('button');b.id='mp-btn';b.textContent='🌍 Multiplayer';
    const p=document.createElement('div');p.id='mp-panel';
    p.innerHTML=`<h3>🌍 Multiplayer</h3><label>Dein Name</label><input id="mp-name" maxlength="16" placeholder="Name"><div class="row"><button id="mp-host">Raum erstellen</button></div><label style="display:block;margin-top:8px">Raumcode</label><input id="mp-code" placeholder="z.B. JV-AB12C" autocapitalize="characters"><div class="row"><button id="mp-join">Beitreten</button><button class="sec" id="mp-leave">Verlassen</button></div><div id="mp-status">Offline – Einzelspieler</div><div id="mp-players"></div><div id="mp-extra"></div><small>${opts.hint||''}</small>`;
    document.body.appendChild(b);document.body.appendChild(p);
    b.onclick=()=>p.classList.toggle('open');
    const n=document.getElementById('mp-name');n.value=Store.get('jv_player_name','');n.onchange=()=>{Store.set('jv_player_name',n.value.trim().slice(0,16));if(peer){if(host)pushRoster();else send({type:'_hello',name:myName()})}};
    document.getElementById('mp-host').onclick=()=>hostRoom(opts.prefix);
    document.getElementById('mp-join').onclick=()=>join(document.getElementById('mp-code').value);
    document.getElementById('mp-leave').onclick=()=>leave();
    return document.getElementById('mp-extra');
  }
  return{hostRoom,join,leave,send,mountPanel,esc,on:(t,f)=>{if(t==='msg')handlers.push(f);else(listeners[t]=listeners[t]||[]).push(f)},
    get online(){return conns.length>0},get isHost(){return host},get id(){return myId},get roster(){return roster},name:myName};
})();

/* ===== JARVIS Sound & Musik (Web Audio, alles synthetisch – keine Dateien nötig) ===== */
const SND=(()=>{
  let ac=null,master,mus,sfx,cfg=Object.assign({music:true,sfx:true},Store.get('jv_sound',{}));
  let want=null,cur=null,step=0,nextT=0,timer=null,tempo=1,noiseBuf=null;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ac){if(ac.state==='suspended')ac.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();master=ac.createGain();master.gain.value=.7;
    const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
    mus=ac.createGain();sfx=ac.createGain();mus.connect(master);sfx.connect(master);apply();
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    timer=setInterval(sched,25)}
  function apply(){if(!ac)return;mus.gain.setTargetAtTime(cfg.music?.32:0,ac.currentTime,.05);sfx.gain.setTargetAtTime(cfg.sfx?.8:0,ac.currentTime,.02);Store.set('jv_sound',cfg);ui()}
  ['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,init,{passive:true}));
  /* Bausteine */
  function tone(f,d,o){o=o||{};if(!ac)return;const t=o.t||ac.currentTime,g=ac.createGain(),os=ac.createOscillator();os.type=o.type||'square';os.frequency.setValueAtTime(f,t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);if(o.det)os.detune.value=o.det;
    const v=o.v==null?.3:o.v,a=o.a||.005;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    let node=os;if(o.lp){const f2=ac.createBiquadFilter();f2.type='lowpass';f2.frequency.value=o.lp;f2.Q.value=o.q||1;os.connect(f2);node=f2}
    node.connect(g);g.connect(o.dest||sfx);os.start(t);os.stop(t+d+.02)}
  function noise(d,o){o=o||{};if(!ac)return;const t=o.t||ac.currentTime,s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=o.ft||'highpass';f.frequency.value=o.f||1000;
    if(o.fto)f.frequency.exponentialRampToValueAtTime(o.fto,t+d);const g=ac.createGain();g.gain.setValueAtTime(o.v||.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(o.dest||sfx);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
  const kick=(t,v)=>tone(150,.16,{t,type:'sine',to:40,v:v||.9,dest:mus});
  const snare=(t,v)=>{noise(.13,{t,f:1500,v:v||.35,dest:mus});tone(190,.08,{t,type:'triangle',v:.25,dest:mus})};
  const hat=(t,v)=>noise(.035,{t,f:7500,v:v||.12,dest:mus});
  const note=(m,t,d,o)=>tone(mf(m),d,Object.assign({t,dest:mus},o));
  /* Effekte */
  const FX={
    click(){tone(880,.06,{type:'triangle',v:.2})},
    jump(){tone(330,.16,{to:740,v:.22})},
    spring(){tone(220,.35,{to:1400,type:'triangle',v:.3});tone(440,.3,{to:2000,v:.1,det:12})},
    crack(){noise(.18,{f:800,ft:'bandpass',v:.5});tone(140,.12,{type:'sawtooth',to:60,v:.2})},
    stomp(){tone(500,.12,{to:120,type:'square',v:.3});noise(.1,{f:400,ft:'lowpass',v:.4})},
    fall(){tone(700,1.1,{to:80,type:'triangle',v:.3,a:.02})},
    coin(n){const b=988*Math.pow(2,Math.min(n||0,12)/48);tone(b,.07,{v:.18});tone(b*1.335,.16,{t:ac&&ac.currentTime+.06,v:.18})},
    swish(){noise(.14,{f:600,fto:3500,ft:'bandpass',v:.35})},
    jump2(){tone(260,.2,{to:620,type:'triangle',v:.3});noise(.08,{f:2000,v:.12})},
    roll(){noise(.25,{f:2500,fto:400,ft:'bandpass',v:.35})},
    power(){if(!ac)return;const t=ac.currentTime;[0,4,7,12].forEach((s,i)=>tone(mf(72+s),.15,{t:t+i*.06,type:'square',v:.18}))},
    shield(){tone(300,.5,{to:1200,type:'sine',v:.35});noise(.3,{f:3000,v:.15})},
    crash(){noise(.6,{f:3000,fto:200,ft:'lowpass',v:.8});tone(120,.5,{type:'sawtooth',to:35,v:.4})},
    win(){if(!ac)return;const t=ac.currentTime;[60,64,67,72,76,79,84].forEach((m,i)=>tone(mf(m),.25,{t:t+i*.08,type:'square',v:.16}));tone(mf(84),.8,{t:t+.56,type:'triangle',v:.25})},
    lose(){if(!ac)return;const t=ac.currentTime;[67,63,60,55].forEach((m,i)=>tone(mf(m),.35,{t:t+i*.18,type:'triangle',v:.25}))},
    think(){tone(mf(76+Math.floor(Math.random()*5)*2),.5,{type:'sine',v:.15,a:.01})},
    reveal(){if(!ac)return;const t=ac.currentTime;noise(.8,{f:300,fto:6000,ft:'bandpass',v:.25});[62,66,69,74].forEach((m,i)=>tone(mf(m+12),1.1,{t:t+.35+i*.07,type:'sine',v:.14}))},
    no(){tone(220,.18,{type:'sawtooth',v:.2,lp:900});tone(165,.3,{t:ac&&ac.currentTime+.15,type:'sawtooth',v:.2,lp:900})},
    learn(){if(!ac)return;const t=ac.currentTime;[69,74,78,81,86].forEach((m,i)=>tone(mf(m),.5,{t:t+i*.1,type:'sine',v:.15}))},
  };
  /* Musikstücke: f(i=Schritt 0-15, bar, t, d=Schrittdauer) */
  const SONGS={
    sky:{bpm:128,bars:4,f(i,b,t,d){const ch=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]][b];
      if(i%4===0)note(ch[0]-24,t,d*3,{type:'triangle',v:.5});if(i%4===2)note(ch[0]-12,t,d*1.5,{type:'triangle',v:.3});
      if(i%2===0)note(ch[[0,1,2,1,0,2,1,2][(i/2)%8]]+12,t,d*1.6,{type:'square',v:.07,lp:2600});
      if(b===3&&i>=12)note([72,74,76,79][i-12],t,d*.9,{type:'square',v:.08,lp:3000});
      if(i%8===0)kick(t,.6);if(i%8===4)snare(t,.2);if(i%2===1)hat(t,.06)}},
    rush:{bpm:146,bars:4,f(i,b,t,d){const r=[45,41,48,43][b];
      note((i%2?r+12:r)-12,t,d*.9,{type:'sawtooth',v:.28,lp:700+300*(i%4),q:4});
      if([0,3,6,10,12].includes(i))note(r+24+[0,7,12,7,3][[0,3,6,10,12].indexOf(i)],t,d*1.2,{type:'square',v:.06,lp:2500});
      if(i%4===0)kick(t,.8);if(i%8===4)snare(t,.3);if(i%2===1)hat(t,.09);if(i===14&&b===3)snare(t,.25)}},
    mystic:{bpm:72,bars:4,f(i,b,t,d){const ch=[[50,53,57],[46,50,53],[53,57,60],[45,49,52]][b];
      if(i===0)ch.forEach(m=>{note(m,t,d*16,{type:'triangle',v:.09,a:.8});note(m+12,t,d*16,{type:'sine',v:.04,a:1.2,det:6})});
      if(i===0||i===8)note(ch[0]-12,t,d*8,{type:'sine',v:.25,a:.3});
      if([2,5,7,11,14].includes(i)&&((i*7+b*3)%5)<3)note(ch[(i+b)%3]+24,t,d*6,{type:'sine',v:.07,a:.005})}},
  };
  function sched(){if(!ac)return;
    if(want!==cur){cur=want;step=0;nextT=ac.currentTime+.05}
    if(!cur||!SONGS[cur])return;const S=SONGS[cur];
    while(nextT<ac.currentTime+.15){const d=60/(S.bpm*tempo)/4;try{S.f(step%16,Math.floor(step/16)%S.bars,nextT,d)}catch(e){}nextT+=d;step++}}
  /* Bedienknöpfe */
  function ui(){const m=document.getElementById('snd-m'),s=document.getElementById('snd-s');if(m){m.textContent=cfg.music?'🎵':'🎵̸';m.style.opacity=cfg.music?1:.4}if(s){s.textContent=cfg.sfx?'🔊':'🔇';s.style.opacity=cfg.sfx?1:.5}}
  function mount(){const st=document.createElement('style');st.textContent='#snd-bar{position:fixed;left:10px;bottom:10px;z-index:9000;display:flex;gap:6px}#snd-bar button{width:42px;height:42px;border-radius:50%;background:#0d1b2a;border:1px solid #0ff8;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 0 10px #0ff3}';document.head.appendChild(st);
    const b=document.createElement('div');b.id='snd-bar';b.innerHTML='<button id="snd-m" title="Musik an/aus">🎵</button><button id="snd-s" title="Soundeffekte an/aus">🔊</button>';document.body.appendChild(b);
    document.getElementById('snd-m').onclick=()=>{init();cfg.music=!cfg.music;apply()};document.getElementById('snd-s').onclick=()=>{init();cfg.sfx=!cfg.sfx;apply();FX.click()};ui();
    document.addEventListener('click',e=>{if(e.target.closest('.btn,#mp-panel button,.ans button,.item,.skin'))play('click')},true)}
  function play(n,a){if(!ac||!cfg.sfx)return;try{FX[n]&&FX[n](a)}catch(e){}}
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',mount);else mount();
  return{play,music(n){want=n},tempo(x){tempo=x},init};
})();

const W=400,H=640,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function fit(){const s=Math.min(innerWidth/W,(innerHeight)/H);const dpr=Math.min(devicePixelRatio||1,2);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*s*dpr;cv.height=H*s*dpr;ctx.setTransform(s*dpr,0,0,s*dpr,0,0);$('stage').style.width=W*s+'px';$('stage').style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const SAVE='jarvis_skyjump_v1',RUN='jarvis_skyjump_run_v1';
let prog=Store.get(SAVE,{best:0,games:0,skin:0,tilt:false});
const SKINS=[{c:'#2ee6a8',n:'Classic',need:0},{c:'#4aa8ff',n:'Blau',need:1000},{c:'#ff6bd6',n:'Pink',need:2500},{c:'#ffb020',n:'Gold',need:5000},{c:'#ff4040',n:'Rot',need:8000},{c:'#ffffff',n:'Geist',need:12000}];
function saveProg(){Store.set(SAVE,prog)}
function mulberry(st){return{s:st>>>0,next(){let t=this.s=(this.s+0x6D2B79F5)>>>0;t=Math.imul(t^t>>>15,1|t);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}}
let G=null,mode='menu',keys={},touchDir=0,tiltX=0,others={},raceSeed=null,lastSent=0,myDead=false;
function newGame(seed){
  const rng=mulberry(seed);
  G={seed,rng,p:{x:W/2-20,y:H-120,vx:0,vy:-11,face:1,squash:0},camY:0,startY:H-120,score:0,plats:[],mons:[],topY:H-40,parts:[]};
  G.plats.push({x:0,y:H-40,w:W,type:'n',ground:1});
  gen();
}
function gen(){
  while(G.topY>G.camY-220){
    const d=Math.min(1,(G.startY-G.topY)/25000);
    const r=G.rng;const gap=34+r.next()*(40+80*d);
    G.topY-=gap;const w=Math.max(46,64-18*d);const x=r.next()*(W-w);
    const t=r.next();let type='n';if(t<0.08+0.27*d)type='m';
    const pl={x,y:G.topY,w,type,vx:type==='m'?(r.next()<.5?-1:1)*(1+2.2*d):0};
    if(type==='n'&&r.next()<0.07)pl.spring=r.next()*(w-16);
    G.plats.push(pl);
    if(r.next()<0.12+0.2*d){const bw=56,bx=r.next()*(W-bw);const by=G.topY+gap*(.3+.4*r.next());if(Math.abs(bx-x)>70)G.plats.push({x:bx,y:by,w:bw,type:'b',vx:0})}
    if(G.startY-G.topY>2500&&r.next()<0.025+0.05*d&&!pl.spring){G.mons.push({x:Math.min(W-44,Math.max(0,x+w/2-22)),y:G.topY-70,w:44,h:36,ph:r.next()*6,vx:r.next()<.5?.8:-.8,dead:0})}
  }
  G.plats=G.plats.filter(p=>p.y<G.camY+H+60);G.mons=G.mons.filter(m=>m.y<G.camY+H+60);
}
function saveRun(){if(raceSeed==null&&G&&mode!=="over")Store.set(RUN,serialize())}
function serialize(){return{seed:G.seed,rs:G.rng.s,p:G.p,camY:G.camY,startY:G.startY,score:G.score,plats:G.plats,mons:G.mons,topY:G.topY}}
function restore(o){G={seed:o.seed,rng:mulberry(0),p:o.p,camY:o.camY,startY:o.startY,score:o.score,plats:o.plats,mons:o.mons,topY:o.topY,parts:[]};G.rng.s=o.rs}
function step(){
  const p=G.p;let inp=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0)||touchDir;
  if(prog.tilt&&!inp)inp=Math.max(-1,Math.min(1,tiltX/22));
  p.vx+=(inp*6.2-p.vx)*0.22;if(Math.abs(inp)>.1)p.face=inp>0?1:-1;
  p.x+=p.vx;if(p.x<-30)p.x+=W;if(p.x>W-10)p.x-=W;
  const oy=p.y;p.vy=Math.min(p.vy+0.36,14);p.y+=p.vy;p.squash*=.85;
  for(const pl of G.plats){if(pl.type==='m'){pl.x+=pl.vx;if(pl.x<0||pl.x+pl.w>W)pl.vx*=-1}if(pl.fall){pl.y+=pl.fall;pl.fall+=.4}}
  if(p.vy>0){for(const pl of G.plats){if(pl.fall)continue;const fx=p.x+8,fx2=p.x+32;if(oy+40<=pl.y+2&&p.y+40>=pl.y&&fx2>pl.x&&fx<pl.x+pl.w){
    if(pl.type==='b'){pl.fall=1;SND.play('crack');burst(pl.x+pl.w/2,pl.y,'#a0703a',6);continue}
    p.y=pl.y-40;const sp=pl.spring!=null&&fx2>pl.x+pl.spring&&fx<pl.x+pl.spring+16;p.vy=sp?-19:-11.6;p.squash=1;SND.play(sp?'spring':'jump');if(sp){pl.sprung=12;burst(p.x+20,p.y+40,'#ffd23a',10)}break}}}
  for(const m of G.mons){if(m.dead){m.y+=m.dead;m.dead+=.5;continue}m.ph+=.08;m.x+=m.vx;if(m.x<0||m.x+m.w>W)m.vx*=-1;
    if(p.x+32>m.x+4&&p.x+8<m.x+m.w-4&&p.y+40>m.y+4&&p.y<m.y+m.h-4){if(p.vy>0&&oy+40<=m.y+14){m.dead=1;p.vy=-14;SND.play('stomp');burst(m.x+22,m.y+18,'#b34dff',14);G.score+=150}else{die();return}}}
  const target=p.y-H*0.42;if(target<G.camY)G.camY=target;
  G.score=Math.max(G.score,Math.floor((G.startY-p.y)/4));
  gen();
  for(const q of G.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.3;q.l--}G.parts=G.parts.filter(q=>q.l>0);
  if(p.y-G.camY>H+20)die();
}
function burst(x,y,c,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4,l:25+Math.random()*15,c})}
function die(){if(mode!=='play')return;mode='over';SND.music(null);SND.play('fall');myDead=true;Store.del(RUN);prog.games++;const nb=G.score>prog.best;if(nb){prog.best=G.score;setTimeout(()=>SND.play('win'),900)}saveProg();
  if(MP.online)MP.send({type:'pos',x:G.p.x,y:G.p.y,score:G.score,alive:false,skin:prog.skin});
  $('final').innerHTML=(nb?'🏆 NEUER REKORD! ':'')+'Punkte: <b>'+G.score+'</b><br>Bestwert: '+prog.best;showResults();show('over');$('pauseBtn').style.display='none'}
function showResults(){const el=$('results');const list=Object.entries(others).map(([id,o])=>({n:MP.roster[id]||o.name||'Spieler',s:o.score,a:o.alive}));if(!list.length){el.innerHTML='';return}
  list.push({n:MP.name()+' (du)',s:G?G.score:0,a:!myDead});list.sort((a,b)=>b.s-a.s);el.innerHTML='<b style="color:#0ff">🏁 Rennen</b>'+list.map((o,i)=>`<div><span>${i+1}. ${MP.esc(o.n)} ${o.a?'🟢':'💀'}</span><span>${o.s}</span></div>`).join('')}
function show(id){['menu','pause','over'].forEach(x=>$(x).classList.toggle('show',x===id));$('back').style.display=id==='none'?'none':''}
/* ---- Zeichnen ---- */
function drawBot(x,y,col,face,squash,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x+20,y+40);ctx.scale(1+squash*.18,1-squash*.2);
  ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,0,14,3,0,0,7);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,-10);ctx.lineTo(-10,-1);ctx.moveTo(8,-10);ctx.lineTo(10,-1);ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-17,-38,34,30,12);ctx.fill();ctx.strokeStyle='#0005';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(face*4,-47);ctx.stroke();ctx.fillStyle='#ff4';ctx.beginPath();ctx.arc(face*4,-48,3,0,7);ctx.fill();
  ctx.fillStyle='#0a1a2a';ctx.beginPath();ctx.roundRect(-12+face*3,-32,24,13,6);ctx.fill();
  ctx.fillStyle='#0ff';ctx.beginPath();ctx.arc(-5+face*5,-25.5,2.8,0,7);ctx.arc(5+face*5,-25.5,2.8,0,7);ctx.fill();ctx.restore()}
function draw(){
  ctx.fillStyle='#f6f2e4';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#d9e4ee';ctx.lineWidth=1;const off=((-G.camY)%20+20)%20;ctx.beginPath();for(let y=off;y<H;y+=20){ctx.moveTo(0,y);ctx.lineTo(W,y)}for(let x=0;x<W;x+=20){ctx.moveTo(x,0);ctx.lineTo(x,H)}ctx.stroke();
  const cy=G.camY;
  for(const pl of G.plats){const y=pl.y-cy;if(y<-20||y>H+20)continue;
    const col=pl.ground?'#6b8f4e':pl.type==='m'?'#3d8bfd':pl.type==='b'?'#a0703a':'#4cc24c';
    ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(pl.x,y,pl.w,12,6);ctx.fill();ctx.fillStyle='#fff5';ctx.fillRect(pl.x+6,y+2,pl.w-12,3);
    if(pl.type==='b'){ctx.strokeStyle='#5a3a16';ctx.beginPath();ctx.moveTo(pl.x+pl.w/2,y);ctx.lineTo(pl.x+pl.w/2-4,y+12);ctx.stroke()}
    if(pl.spring!=null){const sx=pl.x+pl.spring,h=pl.sprung?14:8;if(pl.sprung)pl.sprung--;ctx.strokeStyle='#777';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<4;i++){ctx.moveTo(sx+2,y-i*h/4);ctx.lineTo(sx+14,y-(i+.5)*h/4)}ctx.stroke();ctx.fillStyle='#ffd23a';ctx.fillRect(sx,y-h-3,16,4)}}
  for(const m of G.mons){const y=m.y-cy+Math.sin(m.ph)*3;if(y<-50||y>H+20)continue;ctx.save();ctx.translate(m.x+22,y+18);if(m.dead)ctx.rotate(m.dead*.1);
    ctx.fillStyle='#8a3dff';ctx.beginPath();ctx.ellipse(0,0,22,16,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-4,6,0,7);ctx.arc(8,-4,6,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-7,-3,3,0,7);ctx.arc(9,-3,3,0,7);ctx.fill();
    ctx.fillStyle='#fff';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*5-2,7);ctx.lineTo(i*5+2,7);ctx.lineTo(i*5,11);ctx.fill()}ctx.restore()}
  for(const q of G.parts){ctx.fillStyle=q.c;ctx.globalAlpha=q.l/40;ctx.fillRect(q.x-2,q.y-cy-2,4,4)}ctx.globalAlpha=1;
  // Mitspieler
  for(const [id,o] of Object.entries(others)){const nm=MP.roster[id]||o.name||'?';const col=SKINS[o.skin||0].c;const sy=o.y-cy;
    if(sy>-50&&sy<H+10){drawBot(o.x,sy,col,1,0,o.alive?.45:.2);ctx.fillStyle='#234';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(nm,o.x+20,sy-14)}
    else{const up=sy<=-50;ctx.fillStyle=col;ctx.font='bold 12px Arial';ctx.textAlign='center';const ay=up?58:H-14;ctx.fillText((up?'▲ ':'▼ ')+nm+' '+o.score,Math.max(50,Math.min(W-50,o.x+20)),ay)}}
  drawBot(G.p.x,G.p.y-cy,SKINS[prog.skin].c,G.p.face,G.p.squash,1);
  ctx.textAlign='left';ctx.fillStyle='#0a0a1acc';ctx.beginPath();ctx.roundRect(8,8,150,40,10);ctx.fill();ctx.fillStyle='#0ff';ctx.font='bold 20px Arial';ctx.fillText(G.score,18,35);ctx.fillStyle='#8ab';ctx.font='11px Arial';ctx.fillText('🏆 '+prog.best,90,33);
  if(raceSeed!=null&&MP.online){ctx.fillStyle='#0a0a1acc';ctx.beginPath();ctx.roundRect(8,52,150,22,8);ctx.fill();ctx.fillStyle='#ffd23a';ctx.font='bold 11px Arial';ctx.fillText('🏁 Rennen · '+(Object.keys(others).length+1)+' Spieler',16,67)}
}
let acc=0,last=performance.now(),lastSave=0;
function loop(t){requestAnimationFrame(loop);let dt=Math.min(100,t-last);last=t;
  if(mode==='play'){acc+=dt;while(acc>=1000/60&&mode==='play'){step();acc-=1000/60}
    if(MP.online&&t-lastSent>90){lastSent=t;MP.send({type:'pos',x:G.p.x,y:G.p.y,score:G.score,alive:true,skin:prog.skin})}
    if(t-lastSave>3000&&raceSeed==null){lastSave=t;saveRun()}}
  if(G)draw();else{ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H)}}
requestAnimationFrame(loop);
/* ---- Eingaben ---- */
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='p'||e.key==='Escape')togglePause();if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();touchDir=e.clientX<r.left+r.width/2?-1:1;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!touchDir)return;const r=cv.getBoundingClientRect();touchDir=e.clientX<r.left+r.width/2?-1:1});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>touchDir=0));
addEventListener('deviceorientation',e=>{tiltX=e.gamma||0});
function updTilt(){$('tiltBtn').textContent='📱 Neigungssteuerung: '+(prog.tilt?'an':'aus')}
$('tiltBtn').onclick=async()=>{if(!prog.tilt&&typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){try{await DeviceOrientationEvent.requestPermission()}catch(e){}}prog.tilt=!prog.tilt;saveProg();updTilt()};
function start(seed){newGame(seed);mode='play';SND.music('sky');myDead=false;acc=0;show('none');$('pauseBtn').style.display='block';if(raceSeed!=null)Store.del(RUN);saveRun()}
function togglePause(){if(mode==='play'){mode='pause';saveRun();show('pause');SND.music(null)}else if(mode==='pause'){mode='play';show('none');SND.music('sky')}}
$('pauseBtn').onclick=togglePause;$('cont').onclick=togglePause;
$('play').onclick=()=>{if(MP.online&&MP.isHost){startRace()}else{raceSeed=null;others={};start((Math.random()*1e9)|0)}};
$('again').onclick=$('play').onclick;
$('resume').onclick=()=>{const r=Store.get(RUN,null);if(!r)return;restore(r);raceSeed=null;mode='play';myDead=false;show('none');$('pauseBtn').style.display='block';SND.music('sky')};
function toMenu(){if(mode==='pause')saveRun();mode='menu';$('pauseBtn').style.display='none';menu()}
$('toMenu').onclick=toMenu;$('toMenu2').onclick=toMenu;
addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&raceSeed==null){togglePause()}});
addEventListener('pagehide',()=>{if((mode==='play'||mode==='pause')&&G)saveRun()});
function menu(){show('menu');SND.music('sky');$('best').textContent='🏆 Bestwert: '+prog.best+' · Spiele: '+prog.games;$('resume').style.display=Store.get(RUN,null)?'block':'none';updTilt();
  $('skins').innerHTML=SKINS.map((s,i)=>`<div class="skin ${i===prog.skin?'sel':''} ${prog.best<s.need?'lock':''}" data-i="${i}" title="${s.n}${prog.best<s.need?' – ab '+s.need+' Punkten':''}" style="background:${s.c}"></div>`).join('');
  $('skins').querySelectorAll('.skin').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(prog.best>=SKINS[i].need){prog.skin=i;saveProg();menu()}});
  $('play').textContent=MP.online?(MP.isHost?'🏁 Rennen für alle starten':'⏳ Warte auf Host…'):'▶ Spielen';$('play').disabled=MP.online&&!MP.isHost;}
/* ---- Multiplayer ---- */
const extra=MP.mountPanel({prefix:'JUMP',hint:'Host startet ein Rennen: alle springen auf <b>derselben</b> Strecke. Mitspieler erscheinen als Geister. Wer am höchsten kommt, gewinnt!'});
extra.innerHTML='<button class="btn" id="mp-race" style="min-width:0;width:100%;font-size:14px;padding:9px">🏁 Rennen starten (Host)</button>';
$('mp-race').onclick=()=>{if(!MP.isHost){alert('Nur der Host kann das Rennen starten.');return}startRace()};
function startRace(){const seed=(Math.random()*1e9)|0;others={};MP.send({type:'start',seed});raceSeed=seed;start(seed);$('mp-panel').classList.remove('open')}
MP.on('msg',(m,from)=>{
  if(m.type==='start'){others={};raceSeed=m.seed;start(m.seed);$('mp-panel').classList.remove('open')}
  else if(m.type==='pos'){others[from]=Object.assign(others[from]||{},m);if(mode==='over')showResults()}
  else if(m.type==='_leave'){delete others[from]}
  else if(m.type==='_left'||m.type==='_hosted'||m.type==='_join'){if(mode==='menu')menu()}
});
MP.on('roster',()=>{if(mode==='menu')menu()});
menu();
</script></body></html>
